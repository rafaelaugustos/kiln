name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kiln
          POSTGRES_PASSWORD: kiln
          POSTGRES_DB: kiln
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: kiln
          MYSQL_DATABASE: kiln
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -pkiln"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Kiln-Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Kiln-Passw0rd -C -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KILN_DATABASE_URL: postgres://kiln:kiln@localhost:5432/kiln?sslmode=disable
      KILN_MYSQL_DSN: root:kiln@tcp(localhost:3306)/kiln
      KILN_MSSQL_DSN: sqlserver://sa:Kiln-Passw0rd@localhost:1433?database=kiln
      KILN_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: "**/go.sum"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go vet ./... && go test -race -coverprofile=coverage.out ./...
        working-directory: pgstore
      - run: go vet ./... && go test -race -coverprofile=coverage.out ./...
        working-directory: mysqlstore
      - run: |
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Kiln-Passw0rd -C -b \
            -Q "CREATE DATABASE kiln; ALTER DATABASE kiln SET READ_COMMITTED_SNAPSHOT ON"
          go vet ./... && go test -race -coverprofile=coverage.out ./...
        working-directory: mssqlstore
      - run: go vet ./... && go test -race -coverprofile=coverage.out ./...
        working-directory: sqlitestore
      - run: go vet ./... && go test -race -coverprofile=coverage.out ./...
        working-directory: kilnotel
      - run: go vet ./... && go test -race -coverprofile=coverage.out ./...
        working-directory: redisbus
      - run: go vet ./... && go test ./...
        working-directory: compat
      - run: go vet ./... && go build ./...
        working-directory: examples
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out,pgstore/coverage.out,mysqlstore/coverage.out,mssqlstore/coverage.out,sqlitestore/coverage.out,kilnotel/coverage.out,redisbus/coverage.out
