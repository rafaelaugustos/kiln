site_name: kiln
site_description: Background jobs for Go, kept in PostgreSQL, MySQL, SQL Server or SQLite.
site_url: https://kiln.rafaelaugusto.dev/
repo_url: https://github.com/rafaelaugustos/kiln
repo_name: rafaelaugustos/kiln
edit_uri: edit/main/docs/
copyright: MIT license
exclude_docs: requirements.txt

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt-BR
          name: Português (Brasil)
          build: true
          site_description: Jobs em segundo plano para Go, guardados em PostgreSQL, MySQL, SQL Server ou SQLite.
          nav_translations:
            Home: Início
            Getting started: Primeiros passos
            How it works: Como funciona
            Concepts: Conceitos
            States: Estados
            Enqueueing: Enfileirando
            Retries and cancellation: Retentativas e cancelamento
            Workflows and batches: Workflows e lotes
            Unique jobs: Jobs únicos
            Limits and rate limits: Limites e rate limits
            Queues and workers: Filas e workers
            Recurring jobs: Jobs recorrentes
            Job console: Console do job
            Middleware and observability: Middleware e observabilidade
            Testing: Testes
            Behaviour worth knowing: Comportamentos que vale conhecer
            Operating: Operação
            Running kiln: Rodando o kiln
            Upgrading: Atualizando
            Compatibility: Compatibilidade
            Storage backends: Bancos de dados
            Writing a store: Escrevendo um store
            Coming from Hangfire: Vindo do Hangfire
            How kiln compares: Comparação
            API reference: Referência da API

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: how-it-works.md
  - Concepts:
      - States: concepts/states.md
      - Enqueueing: concepts/enqueueing.md
      - Retries and cancellation: concepts/retries.md
      - Workflows and batches: concepts/workflows.md
      - Unique jobs: concepts/unique.md
      - Limits and rate limits: concepts/limits.md
      - Queues and workers: concepts/queues.md
      - Recurring jobs: concepts/recurring.md
      - Job console: concepts/console.md
      - Middleware and observability: concepts/middleware.md
      - Testing: concepts/testing.md
      - Behaviour worth knowing: behaviour.md
  - Operating:
      - Running kiln: operating.md
      - Dashboard: dashboard.md
      - Upgrading: upgrading.md
      - Compatibility: compatibility.md
  - Stores:
      - Storage backends: backends.md
      - Writing a store: custom-store.md
  - Coming from Hangfire: hangfire.md
  - How kiln compares: comparison.md
  - Performance: performance.md
  - Changelog: changelog.md
  - API reference: https://pkg.go.dev/github.com/rafaelaugustos/kiln
